name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a master run mid-release; only superseded PR runs
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    env:
      # The Electron binary isn't needed to lint, typecheck or run the unit tests
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (Biome)
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  package-windows:
    name: Build & package (Windows x64)
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and package
        run: npm run dist
      - uses: actions/upload-artifact@v5
        with:
          name: exp-tracker-windows-x64
          path: apps/desktop/dist/*.exe
          if-no-files-found: error

  release:
    name: Tag & GitHub release
    needs: package-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::warning::v$version is already released. Bump the version in apps/desktop/package.json to publish a new release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v5
        if: steps.version.outputs.exists == 'false'
        with:
          name: exp-tracker-windows-x64
          path: artifacts
      - name: Create tag and release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" artifacts/*.exe \
            --target "$GITHUB_SHA" \
            --title "EXP Tracker $TAG" \
            --generate-notes
