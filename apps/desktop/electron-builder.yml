appId: com.sefiuzan.owltrack
productName: OwlTrack
# The workspace package is @repo/desktop; per-user installs name their folder after this
# (%LOCALAPPDATA%/Programs/owltrack). userData still follows productName (%APPDATA%/OwlTrack).
extraMetadata:
  name: owltrack
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  - "!**/*.map"
asarUnpack:
  # tesseract.js spawns a worker_thread from its own folder; keep it (and what it loads) on real disk
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/**
  - node_modules/regenerator-runtime/**
  - node_modules/is-url/**
  - node_modules/bmp-js/**
  - node_modules/zlibjs/**
  - node_modules/wasm-feature-detect/**
  - node_modules/node-fetch/**
  - node_modules/whatwg-url/**
  - node_modules/tr46/**
  - node_modules/webidl-conversions/**
  - node_modules/idb-keyval/**
  - resources/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [ x64 ]
nsis:
  # No wizard: install per-user with a progress bar, then launch the app, whose welcome screen
  # (src/renderer/src/welcome) is the setup UI. build/installer.nsh adds uninstall cleanup.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createStartMenuShortcut: true
  # Created on first install; updates keep it removed if the user turned it off in the app.
  createDesktopShortcut: true
  shortcutName: OwlTrack
  artifactName: ${productName}-Setup-${version}.${ext}
npmRebuild: false
